[project]
name = "fastapi-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diego Simonelli", email = "simonellidiego@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.6",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
fastapi-practice = "fastapi_practice:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
